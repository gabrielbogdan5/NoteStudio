<style>
:root{--bg:#0d0b1a;--surface:#1a1535;--surface2:#221d3f;--border:rgba(124,58,237,0.18);--accent:#7c3aed;--accent2:#e040fb;--grad:linear-gradient(135deg,#7c3aed,#e040fb);--text1:#f0ecff;--text2:#b8aee0;--text3:#7a6fa8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text1);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
body::before{content:'';position:fixed;inset:0;z-index:0;background-image:linear-gradient(rgba(124,58,237,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(124,58,237,0.05) 1px,transparent 1px);background-size:40px 40px;pointer-events:none}
.center{position:relative;z-index:1;text-align:center;padding:40px 24px;max-width:420px}
.num{font-size:120px;font-weight:800;line-height:1;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px;letter-spacing:-4px}
.ns-name{font-size:22px;font-weight:800;margin-bottom:8px}
.ns-name span:first-child{color:var(--accent)}
.ns-name span:last-child{color:var(--accent2)}
h2{font-size:20px;font-weight:700;color:var(--text1);margin-bottom:12px}
p{font-size:14px;color:var(--text2);line-height:1.7;margin-bottom:32px}
.links{display:flex;flex-direction:column;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--grad);color:#fff;font-size:14px;font-weight:700;padding:14px 28px;border-radius:12px;text-decoration:none;transition:opacity .2s;width:100%;max-width:280px;justify-content:center}
.btn:hover{opacity:.85}
.btn-ghost{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);color:var(--text2);font-size:14px;font-weight:600;padding:13px 28px;border-radius:12px;text-decoration:none;transition:border-color .2s;width:100%;max-width:280px;justify-content:center}
.btn-ghost:hover{border-color:var(--accent);color:var(--text1)}
</style>
</head>
<body>
<div class="center">
  <div class="num">404</div>
  <div class="ns-name"><span>Note</span><span>Studio</span></div>
  <h2>Page not found</h2>
  <p>The page you're looking for doesn't exist or may have been moved. Head back to the app or explore the links below.</p>

  <div class="links">
    <a class="btn" href="index.html">↩ Back to NoteStudio</a>
    <a class="btn-ghost" href="help.html">📖 Help Guide</a>
    <a class="btn-ghost" href="contact.html">📧 Contact Support</a>
  </div>
</div>
</body>
