<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NoteStudio — Offline</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap');

  :root {
    --bg: #0f0e11;
    --surface: #18171c;
    --border: #352f40;
    --accent: #b78fff;
    --accent2: #ff8fb0;
    --text: #f0ecf8;
    --text2: #a89cc0;
    --text3: #6a5f7e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .container {
    text-align: center;
    padding: 40px 32px;
    max-width: 360px;
  }

  .icon {
    width: 72px;
    height: 72px;
    margin: 0 auto 24px;
    opacity: 0.25;
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.2; transform: scale(1); }
    50%       { opacity: 0.35; transform: scale(1.05); }
  }

  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .logo .n { color: var(--accent); }
  .logo .s { color: var(--accent2); }

  h2 {
    font-size: 15px;
    font-weight: 400;
    color: var(--text2);
    margin-bottom: 28px;
    line-height: 1.6;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 10px 20px;
    font-size: 13px;
    color: var(--text3);
    margin-bottom: 32px;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text3);
    animation: blink 2s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.2; }
  }

  .note-reminder {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    text-align: left;
    margin-bottom: 24px;
  }

  .note-reminder p {
    font-size: 12px;
    color: var(--text3);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .note-reminder span {
    font-size: 14px;
    color: var(--text2);
    line-height: 1.6;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--accent);
    color: #1a0a2e;
    border: none;
    border-radius: 10px;
    padding: 12px 24px;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: filter 0.2s;
  }
  .btn:hover { filter: brightness(1.1); }

  .version {
    margin-top: 32px;
    font-size: 11px;
    color: var(--text3);
  }
</style>
</head>
<body>
<div class="container">

  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#b78fff" stroke-width="1.5">
    <rect x="3" y="3" width="18" height="18" rx="3"/>
    <path d="M8 7h8M8 11h8M8 15h5"/>
    <path d="M17 14l2 2 3-3" stroke="#ff8fb0"/>
  </svg>

  <div class="logo">
    <span class="n">Note</span><span class="s">Studio</span>
  </div>

  <h2>You're offline right now.<br>Your notes are safe locally.</h2>

  <div class="badge">
    <div class="dot"></div>
    No internet connection
  </div>

  <div class="note-reminder">
    <p>💡 Good to know</p>
    <span>All your notes are stored on your device and available offline. Reconnect to sync or export.</span>
  </div>

  <button class="btn" onclick="window.location.reload()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/>
      <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
    </svg>
    Try again
  </button>

  <p class="version">NoteStudio v1.0 — Works offline</p>
</div>
</body>
</html>
